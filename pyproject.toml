[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doomsday-seed"
version = "0.3.0"
description = "末日种子：离线可用的个人 AI 模型种子库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "httpx>=0.27",
    "psutil>=6",
    "huggingface_hub>=2.4.0",
    "PyYAML>=6",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
doomsday-seed = "doomsday_seed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doomsday_seed = ["resources/eval/*.json", "resources/*.txt", "resources/model-research.json", "web/index.html", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
